<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d36"><meta name="description" content="OncoViva workspace">
<title>OncoViva</title>
<style>
:root{--g:#123d36;--g2:#1d6558;--mint:#e8f3ef;--ink:#172522;--muted:#66736f;--line:#e1e9e5;--bg:#f6f8f7;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}header{background:var(--g);color:white;padding:20px 17px;border-radius:0 0 22px 22px}.top{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:#ffffff20;display:grid;place-items:center;font-size:22px}h1{font-size:22px;margin:0;letter-spacing:.4px}header p{margin:2px 0 0;color:#c8ddd7;font-size:12px}.wrap{max-width:780px;margin:auto;padding:18px 15px 100px}h2{font-size:21px;margin:5px 0 8px}.muted{color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:18px;margin:14px 0}.empty{text-align:center;padding:32px 15px}.empty .symbol{font-size:34px;margin-bottom:8px;color:var(--g)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;min-height:90px}.tile b{display:block;margin-bottom:4px}.tile span{font-size:12px;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding:7px 6px calc(7px + env(safe-area-inset-bottom))}nav button{flex:1;max-width:150px;border:0;background:none;color:var(--muted);font-size:10px;padding:5px}nav button span{display:block;font-size:19px}nav button.active{color:var(--g);font-weight:800}@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="top"><div class="logo">✚</div><div><h1>ONCOVIVA</h1><p>YOUR STUDY WORKSPACE</p></div></div></header>
<main class="wrap" id="app"></main>
<nav aria-label="Main navigation">
<button class="active" data-tab="home"><span>⌂</span>Home</button>
<button data-tab="practice"><span>▤</span>Practice</button>
<button data-tab="trials"><span>⚕</span>Trials</button>
<button data-tab="saved"><span>☆</span>Saved</button>
<button data-tab="progress"><span>▥</span>Progress</button>
</nav>
<script>
// Remove any older offline worker/cache so previous sample content cannot reappear.
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}
if('caches' in window){caches.keys().then(keys=>keys.forEach(k=>caches.delete(k))).catch(()=>{});}
const app=document.getElementById('app');
const pages={
 home:['Welcome','Your workspace is ready. Add your own material when you are ready.'],
 practice:['Practice','No practice content has been added.'],
 trials:['Trials','No trial content has been added.'],
 saved:['Saved','No saved items.'],
 progress:['Progress','No activity recorded.']
};
function show(tab){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const [title,description]=pages[tab]||pages.home;app.innerHTML=`<h2>${title}</h2><p class="muted">${description}</p><section class="panel empty"><div class="symbol">✚</div><b>OncoViva</b><p class="muted">This section is empty.</p></section><div class="grid"><div class="tile"><b>Content</b><span>Not added</span></div><div class="tile"><b>Activity</b><span>Not recorded</span></div><div class="tile"><b>Resources</b><span>Not added</span></div></div>`;}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));
show('home');
</script>
</body></html>
