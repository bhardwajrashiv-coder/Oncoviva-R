<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d36"><meta name="description" content="OncoViva — DrNB Surgical Oncology exam preparation">
<link rel="manifest" href="manifest.json"><title>OncoViva | DrNB Surgical Oncology</title>
<style>
:root{--g:#123d36;--g2:#1d6558;--mint:#e8f3ef;--ink:#172522;--muted:#66736f;--line:#e1e9e5;--bg:#f6f8f7;--white:#fff;--red:#b33c3c;--amber:#956516}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.48 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
header{background:var(--g);color:white;padding:17px 17px 20px;border-radius:0 0 23px 23px}.top{display:flex;gap:11px;align-items:center}.logo{width:45px;height:45px;border-radius:14px;background:#ffffff20;display:grid;place-items:center;font-size:23px}h1{font-size:22px;margin:0;letter-spacing:.4px}header p{margin:1px 0 0;color:#c8ddd7;font-size:11px;letter-spacing:.7px}
.wrap{max-width:780px;margin:auto;padding:16px 15px 96px}.muted{color:var(--muted)}h2{font-size:21px;margin:5px 0}h3{font-size:16px;margin:0}.panel,.topic,.qcard,.feature{background:white;border:1px solid var(--line);border-radius:16px;padding:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;color:var(--g);font-size:21px}.stat span{font-size:11px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.primary{background:var(--g);color:#fff;border:0;border-radius:12px;padding:12px 15px;font-weight:700}.secondary{background:var(--mint);color:var(--g);border:0;border-radius:12px;padding:11px 14px;font-weight:700}.ghost{background:white;border:1px solid var(--line);border-radius:11px;padding:9px 12px;color:var(--g)}button:disabled{opacity:.45;cursor:not-allowed}.full{width:100%}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:var(--mint);color:var(--g);font-size:11px;font-weight:700}.pill.amber{background:#fff4dc;color:var(--amber)}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.features{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.feature{text-align:left;min-height:91px;color:var(--ink)}.feature .ico{font-size:23px}.feature b{display:block;margin-top:4px}.feature small{color:var(--muted);font-size:11px}
.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.topic{text-align:left;display:flex;gap:10px;align-items:center;color:var(--ink);min-height:67px}.topic .emoji{font-size:22px}.topic b{display:block;font-size:13px}.topic small{color:var(--muted);font-size:11px}
nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding:7px 7px calc(7px + env(safe-area-inset-bottom))}nav button{flex:1;max-width:150px;border:0;background:none;color:var(--muted);font-size:10px;padding:4px}nav button span{display:block;font-size:19px}nav button.active{color:var(--g);font-weight:800}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.progress{height:7px;background:#e7eeea;border-radius:8px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--g)}.qtext{font-size:18px;font-weight:750;line-height:1.4;margin:16px 0}.option{display:block;width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:12px;padding:13px;margin:8px 0;color:var(--ink)}.option.selected{border:2px solid var(--g);background:var(--mint)}.option.correct{border:2px solid #25835d;background:#e9f6ef}.option.wrong{border:2px solid var(--red);background:#fff0f0}.explain{background:#f0f5f2;border-radius:12px;padding:13px;margin:13px 0;font-size:13px}.imagebox{border:1px dashed #b7c9c1;border-radius:13px;background:#f7faf8;padding:14px;text-align:center;margin:12px 0}.imagebox svg{max-width:100%;height:auto}.imagebox small{display:block;color:var(--muted);margin-top:5px}
input,select{border:1px solid var(--line);border-radius:10px;padding:10px;background:white;color:var(--ink)}.listitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.empty{text-align:center;padding:30px;color:var(--muted)}.result{text-align:center;padding:22px 8px}.result strong{font-size:42px;color:var(--g)}.tiny{font-size:11px}.hide{display:none!important}
@media(min-width:620px){.topics{grid-template-columns:repeat(3,1fr)}.features{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header><div class="top"><div class="logo">✚</div><div><h1>ONCOVIVA</h1><p>DrNB SURGICAL ONCOLOGY • LEARN · PRACTICE · EXCEL</p></div></div></header>
<main class="wrap" id="app"></main>
<nav><button class="active" data-tab="home"><span>⌂</span>Home</button><button data-tab="practice"><span>▤</span>Practice</button><button data-tab="trials"><span>⚕</span>Trials</button><button data-tab="saved"><span>☆</span>Saved</button><button data-tab="progress"><span>▥</span>Progress</button></nav>
<script>
const topics=[["Breast Oncology","🎗️"],["Esophagus & Stomach","🫁"],["Colorectal","🩺"],["HPB & Pancreas","🟤"],["Head & Neck","🗣️"],["Thoracic Oncology","🫁"],["Uro-oncology","🔬"],["Gynecologic Oncology","🌸"],["Sarcoma","🦴"],["Skin Oncology","☀️"],["Endocrine & Adrenal","🧬"],["Principles of Oncology","📚"]];
const Q=[
{id:1,t:"Breast Oncology",d:"Easy",kind:"Trial",q:"Which trial established the benefit of adding pembrolizumab to neoadjuvant chemotherapy followed by adjuvant pembrolizumab in high-risk early TNBC?",o:["IMpassion130","KEYNOTE-522","OlympiA","CREATE-X"],a:1,e:"KEYNOTE-522 demonstrated improvement in pathological complete response and event-free survival with a perioperative pembrolizumab regimen in high-risk early triple-negative breast cancer.",r:"Schmid et al. KEYNOTE-522. NEJM 2020.",py:true},
{id:2,t:"Esophagus & Stomach",d:"Easy",kind:"Trial",q:"The CROSS neoadjuvant chemoradiotherapy regimen uses:",o:["Cisplatin + 5-FU with 50.4 Gy","Carboplatin + paclitaxel with 41.4 Gy","FLOT with 45 Gy","FOLFOX with 50 Gy"],a:1,e:"CROSS used weekly carboplatin (AUC 2) and paclitaxel (50 mg/m²) with 41.4 Gy radiotherapy, followed by surgery.",r:"van Hagen et al. CROSS trial. NEJM 2012.",py:true},
{id:3,t:"Colorectal",d:"Moderate",kind:"Trial",q:"The FOxTROT trial investigated:",o:["Adjuvant immunotherapy in rectal cancer","Preoperative chemotherapy for operable colon cancer","HIPEC for appendiceal cancer","Non-operative management after CRT"],a:1,e:"FOxTROT evaluated preoperative oxaliplatin-fluoropyrimidine chemotherapy in operable colon cancer, demonstrating downstaging and reduction in residual/recurrent disease in selected patients.",r:"FOxTROT Collaborative Group. JCO / Lancet Oncology reports.",py:true},
{id:4,t:"HPB & Pancreas",d:"Easy",kind:"Concept",q:"The original Fistula Risk Score after pancreaticoduodenectomy includes all EXCEPT:",o:["Pancreatic texture","Pathology","Pancreatic duct diameter","Preoperative serum sodium"],a:3,e:"The original Fistula Risk Score uses gland texture, pathology, pancreatic duct diameter and intraoperative blood loss.",r:"Callery et al. Annals of Surgery 2013.",py:true},
{id:5,t:"Head & Neck",d:"Easy",kind:"Concept",q:"The most common histological type of oral cavity malignancy is:",o:["Adenocarcinoma","Squamous cell carcinoma","Mucoepidermoid carcinoma","Lymphoma"],a:1,e:"Squamous cell carcinoma accounts for the vast majority of oral cavity cancers.",r:"Standard head and neck oncology references.",py:true},
{id:6,t:"Uro-oncology",d:"Easy",kind:"Trial",q:"CheckMate 274 evaluated adjuvant which agent in high-risk muscle-invasive urothelial carcinoma?",o:["Atezolizumab","Nivolumab","Pembrolizumab","Durvalumab"],a:1,e:"CheckMate 274 showed improved disease-free survival with adjuvant nivolumab versus placebo in high-risk patients after radical surgery.",r:"Bajorin et al. NEJM 2021.",py:true},
{id:7,t:"Gynecologic Oncology",d:"Moderate",kind:"Trial",q:"The LION trial evaluated systematic lymphadenectomy in advanced ovarian cancer patients with:",o:["Bulky radiologically positive nodes","Clinically normal nodes after macroscopically complete resection","Early-stage disease only","Isolated para-aortic recurrence"],a:1,e:"Systematic lymphadenectomy did not improve overall or progression-free survival in this selected population and increased postoperative complications.",r:"Harter et al. NEJM 2019.",py:true},
{id:8,t:"Sarcoma",d:"Easy",kind:"Concept",q:"The Enneking/MSTS staging system is primarily used for:",o:["Musculoskeletal sarcomas","Breast carcinoma","Gastric carcinoma","Melanoma"],a:0,e:"The Enneking system stages musculoskeletal sarcomas using grade, local extent and metastasis.",r:"Enneking staging system.",py:true},
{id:9,t:"Principles of Oncology",d:"Easy",kind:"Concept",q:"Intention-to-treat analysis means participants are analysed:",o:["Only if they complete treatment","According to their originally randomized group","Only if protocol compliant","After excluding crossovers"],a:1,e:"Intention-to-treat preserves randomization by analysing participants in their originally assigned groups regardless of adherence or crossover.",r:"CONSORT / clinical trial methodology.",py:true},
{id:10,t:"Esophagus & Stomach",d:"Easy",kind:"Concept",q:"The Siewert classification categorizes adenocarcinoma of the:",o:["Distal esophagus and gastroesophageal junction","Entire stomach","Mid-esophagus only","Duodenum"],a:0,e:"Siewert types I–III classify adenocarcinomas by tumour epicentre relative to the gastroesophageal junction.",r:"Siewert classification.",py:true},
{id:11,t:"Breast Oncology",d:"Moderate",kind:"Trial",q:"OlympiA evaluated adjuvant olaparib in patients with:",o:["HER2-positive disease","Germline BRCA1/2 pathogenic variants and high-risk HER2-negative early breast cancer","All luminal A cancers","Metastatic TNBC without BRCA mutation"],a:1,e:"OlympiA demonstrated invasive and distant disease-free survival benefit with one year of adjuvant olaparib in eligible high-risk, germline BRCA-mutated, HER2-negative early breast cancer.",r:"Tutt et al. NEJM 2021.",py:true},
{id:12,t:"HPB & Pancreas",d:"Moderate",kind:"Trial",q:"PRODIGE 24 established which adjuvant regimen as superior to gemcitabine in fit patients after pancreatic cancer resection?",o:["Gemcitabine-capecitabine","Modified FOLFIRINOX","FOLFOX","FOLFIRI"],a:1,e:"Modified FOLFIRINOX improved disease-free and overall survival compared with gemcitabine in selected fit patients after resection.",r:"Conroy et al. NEJM 2018.",py:true},
{id:13,t:"Breast Oncology",d:"Moderate",kind:"Trial",q:"CREATE-X showed benefit from adjuvant capecitabine particularly in which subgroup after residual invasive disease following neoadjuvant chemotherapy?",o:["HER2-positive","Triple-negative breast cancer","Pure DCIS","Low-risk luminal A"],a:1,e:"CREATE-X demonstrated improved disease-free and overall survival with adjuvant capecitabine in HER2-negative patients with residual invasive disease; benefit was particularly notable in the TNBC subgroup.",r:"Masuda et al. NEJM 2017."},
{id:14,t:"Esophagus & Stomach",d:"Moderate",kind:"Trial",q:"The Neo-AEGIS trial compared trimodality CROSS-type therapy with:",o:["Perioperative chemotherapy","Surgery alone","Definitive radiotherapy alone","Adjuvant immunotherapy"],a:0,e:"Neo-AEGIS compared trimodality therapy with perioperative chemotherapy in oesophageal/GOJ adenocarcinoma. The chemotherapy arm predominantly used older modified MAGIC-type regimens.",r:"Reynolds et al. Lancet Gastroenterology & Hepatology 2023."},
{id:15,t:"Colorectal",d:"Easy",kind:"Trial",q:"The IDEA collaboration primarily examined:",o:["Duration of adjuvant oxaliplatin-based chemotherapy in stage III colon cancer","HIPEC versus CRS","Neoadjuvant immunotherapy in rectal cancer","Screening intervals"],a:0,e:"IDEA pooled data from six trials to assess 3 versus 6 months of adjuvant CAPOX/FOLFOX in stage III colon cancer.",r:"IDEA collaboration; NEJM 2018."},
{id:16,t:"Gynecologic Oncology",d:"Moderate",kind:"Trial",q:"The SOLO-1 trial evaluated maintenance:",o:["Bevacizumab in all-comers","Olaparib in newly diagnosed advanced ovarian cancer with BRCA mutation","Pembrolizumab in cervical cancer","Niraparib in endometrial cancer"],a:1,e:"SOLO-1 showed substantial progression-free survival benefit with maintenance olaparib in newly diagnosed advanced ovarian cancer with BRCA1/2 mutation responding to platinum chemotherapy.",r:"Moore et al. NEJM 2018."},
{id:17,t:"Thoracic Oncology",d:"Easy",kind:"Trial",q:"ADRIATIC evaluated consolidation treatment after chemoradiotherapy in:",o:["Limited-stage small-cell lung cancer","Resectable NSCLC","Mesothelioma","Thymoma"],a:0,e:"ADRIATIC evaluated durvalumab after concurrent chemoradiotherapy in limited-stage small-cell lung cancer.",r:"ADRIATIC trial; NEJM 2024."},
{id:18,t:"Uro-oncology",d:"Moderate",kind:"Trial",q:"CARMENA compared sunitinib alone with:",o:["Nephrectomy followed by sunitinib in metastatic clear-cell RCC","Adjuvant pembrolizumab","Ablation versus partial nephrectomy","Nivolumab versus ipilimumab"],a:0,e:"CARMENA showed sunitinib alone was non-inferior to cytoreductive nephrectomy followed by sunitinib in the studied intermediate/poor-risk metastatic clear-cell RCC population.",r:"Méjean et al. NEJM 2018."},
{id:19,t:"Principles of Oncology",d:"Easy",kind:"Concept",q:"A hazard ratio of 0.70 for an event in the experimental arm versus control generally indicates:",o:["30% lower instantaneous hazard, subject to model assumptions","30% absolute risk reduction","70% longer median survival","No treatment effect"],a:0,e:"A hazard ratio of 0.70 corresponds to a 30% lower hazard over follow-up under the proportional hazards interpretation; it is not an absolute risk reduction.",r:"Standard survival analysis interpretation."},
{id:20,t:"Head & Neck",d:"Moderate",kind:"Trial",q:"The landmark randomized trial that established postoperative concurrent cisplatin with radiotherapy for high-risk resected head and neck cancer included:",o:["RTOG 9501 and EORTC 22931","KEYNOTE-522","CROSS","LION"],a:0,e:"RTOG 9501 and EORTC 22931 established benefit of postoperative concurrent cisplatin-radiotherapy in selected high-risk patients; pooled analyses highlighted ENE and positive margins as key features.",r:"Cooper et al. NEJM 2004; Bernier et al. NEJM 2004."},
{id:21,t:"Breast Oncology",d:"Easy",kind:"Image",q:"Identify the breast cancer biomarker pattern represented in this schematic.",img:"ihc",o:["ER positive, PR positive, HER2 negative","ER negative, PR negative, HER2 positive","Triple-negative phenotype","ER positive, HER2 amplified"],a:0,e:"This is a teaching schematic showing nuclear ER/PR positivity with HER2 non-amplified status. It is an illustrative diagram, not a real patient immunohistochemistry slide.",r:"Illustrative teaching schematic; correlate with validated IHC/ISH testing."},
{id:22,t:"Esophagus & Stomach",d:"Moderate",kind:"Image",q:"In this simplified diagram, which label indicates the gastroesophageal junction (GEJ) used as the reference for Siewert classification?",img:"gej",o:["A","B","C","D"],a:1,e:"B marks the gastroesophageal junction in this schematic. Siewert classification is based on the tumour epicentre relative to the GEJ.",r:"Siewert classification; schematic for learning."},
{id:23,t:"HPB & Pancreas",d:"Easy",kind:"Image",q:"The diagram highlights the pancreatic duct. Which structure is it?",img:"pancreas",o:["Main pancreatic duct","Common bile duct","Cystic duct","Portal vein"],a:0,e:"The central duct running through the pancreas is the main pancreatic duct (duct of Wirsung).",r:"Anatomical teaching schematic."},
{id:24,t:"Colorectal",d:"Moderate",kind:"Trial",q:"The RAPIDO trial studied short-course radiotherapy followed by chemotherapy and surgery in:",o:["Locally advanced rectal cancer","Early colon cancer","Anal melanoma","GIST"],a:0,e:"RAPIDO evaluated a total neoadjuvant therapy strategy using short-course radiotherapy followed by chemotherapy before surgery in high-risk locally advanced rectal cancer.",r:"Bahadoer et al. Lancet Oncology 2021."},
{id:25,t:"Esophagus & Stomach",d:"Moderate",kind:"Trial",q:"MATTERHORN evaluated the addition of which agent to perioperative FLOT in resectable gastric/GEJ adenocarcinoma?",o:["Nivolumab","Durvalumab","Atezolizumab","Ipilimumab"],a:1,e:"MATTERHORN evaluated durvalumab plus perioperative FLOT versus FLOT alone in resectable gastric/GEJ adenocarcinoma. Check current published updates for mature endpoints and regulatory context.",r:"MATTERHORN phase III trial; published 2025 results."},
{id:26,t:"Gynecologic Oncology",d:"Easy",kind:"Trial",q:"The LACC trial raised concern about minimally invasive radical hysterectomy for:",o:["Early-stage cervical cancer","Ovarian germ cell tumour","Endometrial sarcoma","Vulvar melanoma"],a:0,e:"LACC found worse oncologic outcomes with minimally invasive radical hysterectomy compared with open abdominal radical hysterectomy in early cervical cancer.",r:"Ramirez et al. NEJM 2018."},
{id:27,t:"Sarcoma",d:"Moderate",kind:"Concept",q:"A classic translocation associated with synovial sarcoma is:",o:["t(11;22) EWSR1-FLI1","t(X;18) SS18-SSX","t(12;16) FUS-DDIT3","t(9;22) BCR-ABL1"],a:1,e:"Synovial sarcoma is characteristically associated with t(X;18), producing SS18-SSX fusion.",r:"WHO Classification of Soft Tissue and Bone Tumours."},
{id:28,t:"Skin Oncology",d:"Easy",kind:"Concept",q:"The most important risk factor for cutaneous squamous cell carcinoma in many populations is:",o:["Chronic ultraviolet exposure","Low dietary calcium","Helicobacter pylori","Estrogen exposure"],a:0,e:"Cumulative ultraviolet exposure is a major risk factor for cutaneous squamous cell carcinoma.",r:"Standard dermatologic oncology references."},
{id:29,t:"Endocrine & Adrenal",d:"Moderate",kind:"Concept",q:"Before surgery for a functional pheochromocytoma, the usual initial pharmacologic preparation is:",o:["Beta blockade before alpha blockade","Alpha blockade before beta blockade if needed","ACE inhibitor alone","No preparation"],a:1,e:"Preoperative alpha-adrenergic blockade is established first; beta blockade may be added afterward for persistent tachycardia. Starting beta blockade first risks unopposed alpha stimulation.",r:"Endocrine Society clinical practice guideline."},
{id:30,t:"Thoracic Oncology",d:"Easy",kind:"Trial",q:"The ADAURA trial evaluated adjuvant osimertinib in resected NSCLC with:",o:["EGFR exon 19 deletion or L858R mutation","ALK rearrangement","KRAS G12C only","ROS1 fusion"],a:0,e:"ADAURA demonstrated disease-free survival benefit with adjuvant osimertinib in resected EGFR-mutated NSCLC (exon 19 deletion or L858R).",r:"Tsuboi et al. NEJM 2023; ADAURA."}
];
const state={tab:"home",quiz:null,book:JSON.parse(localStorage.getItem("ovBook")||"[]"),done:JSON.parse(localStorage.getItem("ovDone")||"{}"),history:JSON.parse(localStorage.getItem("ovHist")||"[]")};
const app=document.getElementById("app");const save=()=>{localStorage.setItem("ovBook",JSON.stringify(state.book));localStorage.setItem("ovDone",JSON.stringify(state.done));localStorage.setItem("ovHist",JSON.stringify(state.history))};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function tab(t){state.tab=t;state.quiz=null;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render()}
function render(){if(state.quiz)return quizView();({home,practice,trials,saved,progress}[state.tab]||home)()}
function home(){let n=Object.keys(state.done).length,c=Object.values(state.done).filter(x=>x.correct).length;
app.innerHTML=`<h2>Welcome to OncoViva 👋</h2><p class="muted">Your DrNB Surgical Oncology revision companion.</p><div class="stats"><div class="stat"><b>${Q.length}</b><span>Starter MCQs</span></div><div class="stat"><b>${n}</b><span>Attempted</span></div><div class="stat"><b>${n?Math.round(c/n*100):0}%</b><span>Accuracy</span></div></div>
<div class="panel"><div class="row between"><div><b>Daily 20-question challenge</b><div class="muted tiny">A fresh practice session each day</div></div><span class="pill">20 Q</span></div><button class="primary full" style="margin-top:12px" onclick="daily()">Start today's challenge →</button></div>
<div class="section"><h3>Study modes</h3><small class="muted">Choose your practice</small></div><div class="features">
<button class="feature" onclick="start('PYQ-style',15)"><span class="ico">📘</span><b>PYQ-style MCQs</b><small>Exam-pattern questions</small></button>
<button class="feature" onclick="tab('trials')"><span class="ico">⚕️</span><b>Important trials</b><small>Landmark oncology studies</small></button>
<button class="feature" onclick="start('Image',10)"><span class="ico">🖼️</span><b>Image-based</b><small>Visual identification practice</small></button>
<button class="feature" onclick="mock()"><span class="ico">⏱️</span><b>Mock examination</b><small>Timed exam simulation</small></button>
</div><div class="section"><h3>Subjects</h3><small class="muted">12 modules</small></div><div class="topics">${topics.map(([t,e])=>`<button class="topic" onclick="start('${t}',10)"><span class="emoji">${e}</span><span><b>${t}</b><small>${Q.filter(q=>q.t===t).length} starter questions</small></span></button>`).join("")}</div>
<p class="tiny muted" style="margin-top:17px">Starter question bank for personal study. Questions are educational and should be checked against current guidelines and original publications.</p>`}
function practice(){app.innerHTML=`<h2>Practice MCQs</h2><p class="muted">Filter by subject or question style.</p><div class="panel"><label>Question type </label><select id="kind"><option value="All">All questions</option><option>Trial</option><option>Concept</option><option>Image</option></select> <label>Subject </label><select id="sub"><option value="All">All subjects</option>${topics.map(([t])=>`<option>${t}</option>`).join("")}</select><label>Count </label><select id="num"><option>5</option><option selected>10</option><option>20</option></select><button class="primary full" style="margin-top:12px" onclick="filtered()">Start practice</button></div><div class="section"><h3>Question bank</h3></div><div class="topics">${topics.map(([t,e])=>`<button class="topic" onclick="start('${t}',20)"><span class="emoji">${e}</span><span><b>${t}</b><small>${Q.filter(q=>q.t===t).length} available</small></span></button>`).join("")}</div>`}
function trials(){let ts=Q.filter(q=>q.kind==="Trial");app.innerHTML=`<h2>Important clinical trials</h2><p class="muted">Trial-focused revision from the starter bank.</p><div class="panel"><b>${ts.length} trial questions</b><p class="tiny muted">Revise the study question, intervention, comparator and key finding. Verify all details with the original publication.</p><button class="primary" onclick="start('Trial',${ts.length})">Practice trial MCQs</button></div>${ts.map(q=>`<div class="listitem"><span><b>${esc(q.r.split(".")[0])}</b><small class="muted" style="display:block">${esc(q.t)} · ${esc(q.q)}</small></span><span class="pill">Trial</span></div>`).join("")}`}
function saved(){let a=Q.filter(q=>state.book.includes(q.id));app.innerHTML=`<h2>Bookmarked questions</h2>${a.length?a.map(q=>`<div class="panel" style="margin:9px 0"><span class="pill">${esc(q.t)}</span><p><b>${esc(q.q)}</b></p><button class="secondary" onclick="startOne(${q.id})">Practice</button> <button class="ghost" onclick="bookmark(${q.id})">Remove</button></div>`).join(""):`<div class="empty">☆<p>No saved questions yet.</p>Bookmark questions while practising.</div>`}`}
function progress(){let n=Object.keys(state.done).length,c=Object.values(state.done).filter(x=>x.correct).length;app.innerHTML=`<h2>Your progress</h2><div class="stats"><div class="stat"><b>${n}</b><span>Attempted</span></div><div class="stat"><b>${c}</b><span>Correct</span></div><div class="stat"><b>${n?Math.round(c/n*100):0}%</b><span>Accuracy</span></div></div><div class="panel"><b>Revision focus</b><p class="muted tiny">${n-c} incorrect attempted questions to revisit.</p><button class="secondary" onclick="reviewWrong()">Review incorrect questions</button></div><div class="section"><h3>Recent mock tests</h3></div>${state.history.length?state.history.slice(0,12).map(h=>`<div class="listitem"><span>${esc(h.label)}<small class="muted" style="display:block">${new Date(h.date).toLocaleDateString()}</small></span><b>${h.score}/${h.total}</b></div>`).join(""):`<div class="empty">No tests completed yet.</div>`}<p class="tiny muted">Your progress is stored locally in this browser on this device.</p>`}
function filtered(){let k=document.getElementById("kind").value,s=document.getElementById("sub").value,n=+document.getElementById("num").value;let a=Q.filter(q=>(k==="All"||q.kind===k)&&(s==="All"||q.t===s));begin(a.slice().sort(()=>Math.random()-.5).slice(0,n),"Practice")}
function start(filter,n){let a=Q.filter(q=>filter==="All"||q.t===filter||q.kind===filter||(filter==="PYQ-style"&&q.py));begin(a.slice().sort(()=>Math.random()-.5).slice(0,n),filter)}
function daily(){let d=new Date(),key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();let seed=key.split("").reduce((a,c)=>a+c.charCodeAt(0),0);let a=Q.slice().sort((x,y)=>((x.id*seed)%97)-((y.id*seed)%97)).slice(0,20);begin(a,"Daily 20-question challenge")}
function mock(){let a=Q.slice().sort(()=>Math.random()-.5).slice(0,20);begin(a,"Mock examination",true)}
function begin(items,label,timed=false){if(!items.length){alert("No questions found for this selection yet.");return}state.quiz={items,index:0,answers:{},reveal:false,label,start:Date.now(),timed,seconds:timed?30*60:0};quizView()}
function startOne(id){begin([Q.find(q=>q.id===id)],"Bookmark practice")}
function quizView(){let z=state.quiz,q=z.items[z.index],ans=z.answers[q.id],r=z.reveal;let timer=z.timed?`<span id="timer">30:00</span>`:"";
let img=q.img?imageMarkup(q.img):"";
app.innerHTML=`<div class="row between"><button class="ghost" onclick="quit()">← Exit</button><span class="pill">${esc(z.label)}</span>${timer}</div><div class="qhead" style="margin-top:14px"><span>Question ${z.index+1} of ${z.items.length}</span><span>${q.d} · ${q.kind}</span></div><div class="progress"><i style="width:${(z.index+1)/z.items.length*100}%"></i></div><div class="qcard"><div class="qtext">${esc(q.q)}</div>${img}${q.o.map((o,i)=>`<button class="option ${r&&i===q.a?"correct":""} ${r&&ans===i&&i!==q.a?"wrong":""} ${ans===i&&!r?"selected":""}" ${r?"disabled":""} onclick="choose(${i})"><b>${"ABCD"[i]}.</b> ${esc(o)}</button>`).join("")}${r?`<div class="explain"><b>${ans===q.a?"Correct!":"Correct answer: "+ "ABCD"[q.a]}</b><p>${esc(q.e)}</p><small><b>Reference:</b> ${esc(q.r)}</small></div>`:""}<div class="row between" style="margin-top:12px"><button class="ghost" onclick="bookmark(${q.id})">${state.book.includes(q.id)?"★ Saved":"☆ Bookmark"}</button>${!r?`<button class="primary" ${ans===undefined?"disabled":""} onclick="check()">Check answer</button>`:`<button class="primary" onclick="next()">${z.index===z.items.length-1?"Finish":"Next →"}</button>`}</div></div>`;
if(z.timed&&!r){clearInterval(window.ovTimer);window.ovTimer=setInterval(()=>{if(!state.quiz)return;z.seconds--;let el=document.getElementById("timer");if(el)el.textContent=Math.floor(z.seconds/60)+":"+String(z.seconds%60).padStart(2,"0");if(z.seconds<=0){clearInterval(window.ovTimer);finish()}},1000)}
}
function imageMarkup(type){if(type==="ihc")return `<div class="imagebox"><svg viewBox="0 0 320 150" role="img" aria-label="Illustrative immunohistochemistry schematic"><rect x="4" y="4" width="312" height="142" rx="10" fill="#fff" stroke="#d6e2dc"/><text x="80" y="22" text-anchor="middle" font-size="11" fill="#455">ER</text><text x="160" y="22" text-anchor="middle" font-size="11" fill="#455">PR</text><text x="240" y="22" text-anchor="middle" font-size="11" fill="#455">HER2</text>${[65,145].map(x=>Array.from({length:4},(_,i)=>`<circle cx="${x+i*8}" cy="${58+(i%2)*18}" r="12" fill="#8b5a39" opacity=".8"/>`).join("")).join("")}<g fill="#d8d8d8" stroke="#777"><rect x="215" y="40" width="58" height="52" rx="5"/></g><g fill="#d8d8d8" stroke="#777">${Array.from({length:7},(_,i)=>`<circle cx="${225+(i%3)*16}" cy="${51+Math.floor(i/3)*17}" r="5"/>`).join("")}</g><text x="160" y="122" text-anchor="middle" font-size="10" fill="#667">Illustrative marker pattern only — not a patient slide</text></svg><small>Teaching schematic: illustrative IHC pattern</small></div>`;
if(type==="gej")return `<div class="imagebox"><svg viewBox="0 0 320 170"><path d="M145 15 C125 45 125 65 145 82 L145 142 L175 142 L175 82 C195 65 195 45 175 15" fill="#f2c8a8" stroke="#9c6b52" stroke-width="2"/><path d="M145 82 L175 82" stroke="#123d36" stroke-width="4"/><g font-size="13" fill="#123d36" font-weight="bold"><text x="205" y="35">A</text><text x="205" y="85">B</text><text x="205" y="125">C</text><text x="105" y="155">D</text></g><path d="M190 82 L178 82" stroke="#123d36" stroke-width="2"/></svg><small>Simplified oesophagus–stomach junction schematic</small></div>`;
return `<div class="imagebox"><svg viewBox="0 0 320 160"><path d="M65 80 C80 30 140 28 160 60 C180 25 245 35 255 80 C245 125 180 132 160 100 C140 132 80 125 65 80Z" fill="#e9b58e" stroke="#9c6b52" stroke-width="2"/><path d="M78 80 C115 70 135 92 160 80 C190 68 215 93 242 80" fill="none" stroke="#286d9b" stroke-width="5"/><text x="160" y="148" text-anchor="middle" font-size="11" fill="#455">Pancreas and main duct — simplified schematic</text></svg><small>Anatomical teaching schematic</small></div>`}
function choose(i){let z=state.quiz,q=z.items[z.index];z.answers[q.id]=i;quizView()}
function check(){let z=state.quiz,q=z.items[z.index];z.reveal=true;state.done[q.id]={correct:z.answers[q.id]===q.a,date:Date.now()};save();quizView()}
function next(){let z=state.quiz;if(z.index===z.items.length-1){finish();return}z.index++;z.reveal=false;quizView()}
function finish(){let z=state.quiz,score=z.items.filter(q=>z.answers[q.id]===q.a).length;state.history.unshift({date:Date.now(),score,total:z.items.length,label:z.label});save();clearInterval(window.ovTimer);state.quiz=null;app.innerHTML=`<div class="panel result"><span class="pill">Completed</span><h2>${esc(z.label)}</h2><strong>${score}/${z.items.length}</strong><p class="muted">${Math.round(score/z.items.length*100)}% score</p><button class="primary" onclick="tab('home')">Back to home</button> <button class="secondary" onclick="tab('progress')">View progress</button></div>`}
function quit(){if(confirm("Exit this session?")){clearInterval(window.ovTimer);state.quiz=null;render()}}
function bookmark(id){state.book=state.book.includes(id)?state.book.filter(x=>x!==id):[...state.book,id];save();if(state.quiz)quizView();else render()}
function reviewWrong(){let ids=Object.keys(state.done).filter(id=>!state.done[id].correct).map(Number),a=Q.filter(q=>ids.includes(q.id));if(!a.length){alert("No incorrect attempted questions yet.");return}begin(a,"Incorrect-answer revision")}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>tab(b.dataset.tab)));
if("serviceWorker"in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("./sw.js").catch(()=>{});
render();
</script></main></body></html>
