<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d36">
<meta name="description" content="OncoViva Surgical Oncology question manager and practice app">
<title>OncoViva</title>
<style>
:root{--g:#123d36;--g2:#1d6558;--mint:#e8f3ef;--ink:#172522;--muted:#66736f;--line:#e1e9e5;--bg:#f6f8f7;--white:#fff;--red:#a52e2e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--g);color:white;padding:18px 17px 20px;border-radius:0 0 22px 22px}.top{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:#ffffff20;display:grid;place-items:center;font-size:22px}h1{font-size:22px;margin:0;letter-spacing:.4px}header p{margin:2px 0 0;color:#c8ddd7;font-size:12px}
.wrap{max-width:780px;margin:auto;padding:18px 15px 110px}h2{font-size:21px;margin:5px 0 8px}h3{font-size:16px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:16px;margin:13px 0}.empty{text-align:center;padding:28px 15px}.symbol{font-size:32px;color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{background:white;border:1px solid var(--line);border-radius:15px;padding:15px;min-height:85px}.tile b{display:block}.tile span{font-size:12px;color:var(--muted)}
button,.btn{border:0;border-radius:12px;background:var(--g);color:white;padding:11px 14px;font:inherit;font-weight:650;cursor:pointer}.btn.secondary,button.secondary{background:var(--mint);color:var(--g)}button.ghost{background:#f0f3f2;color:var(--ink)}button.danger{background:#fff0f0;color:var(--red)}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}
label{display:block;font-weight:650;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #cfdad5;border-radius:11px;padding:12px;font:inherit;background:white;color:var(--ink)}textarea{min-height:85px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid #9bc9bb;border-color:var(--g2)}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{display:flex;gap:8px;align-items:center;margin:7px 0}.option input{width:auto}
.question{font-size:17px;font-weight:700;margin:8px 0 12px}.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#f5f8f6;color:var(--ink);border:1px solid var(--line);font-weight:500}.choice.selected{border:2px solid var(--g2);background:var(--mint)}.choice.correct{border:2px solid #21834a;background:#effaf2}.choice.wrong{border:2px solid #b43c3c;background:#fff2f2}
.pill{display:inline-block;background:var(--mint);color:var(--g);padding:3px 9px;border-radius:30px;font-size:11px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7faf8;border:1px solid var(--line);padding:12px;border-radius:13px}.stat b{display:block;font-size:22px;color:var(--g)}.stat span{font-size:11px;color:var(--muted)}
.listitem{border-bottom:1px solid var(--line);padding:13px 0}.listitem:last-child{border:0}.listhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.listhead b{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:130px;border:0;background:none;color:var(--muted);font-size:10px;padding:5px 2px;font-weight:500}nav button span{display:block;font-size:19px}nav button.active{color:var(--g);font-weight:800}
.notice{background:#fff8e8;border:1px solid #f0dfb6;border-radius:12px;padding:11px;font-size:12px;color:#65501c}
@media(max-width:420px){.fieldgrid{grid-template-columns:1fr}.wrap{padding-left:12px;padding-right:12px}.panel{padding:14px}}
</style>
</head>
<body>
<header><div class="top"><div class="logo">✚</div><div><h1>ONCOVIVA</h1><p>DRNB SURGICAL ONCOLOGY WORKSPACE</p></div></div></header>
<main class="wrap" id="app"></main>
<nav aria-label="Main navigation">
<button class="active" data-tab="home"><span>⌂</span>Home</button>
<button data-tab="add"><span>＋</span>Add MCQ</button>
<button data-tab="bank"><span>▤</span>Question bank</button>
<button data-tab="practice"><span>▶</span>Practice</button>
<button data-tab="progress"><span>▥</span>Progress</button>
</nav>
<script>
const KEY='oncoviva_questions_v1', STATS='oncoviva_stats_v1', SAVED='oncoviva_saved_v1';
let questions=load(KEY,[]), stats=load(STATS,{attempted:0,correct:0}), saved=load(SAVED,[]);
let current=null, chosen=null, answered=false, practiceQueue=[];
const app=document.getElementById('app');
function load(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function persist(){localStorage.setItem(KEY,JSON.stringify(questions));localStorage.setItem(STATS,JSON.stringify(stats));localStorage.setItem(SAVED,JSON.stringify(saved))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setTab(t){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));({home,add:showAdd,bank:showBank,practice:showPractice,progress:showProgress}[t]||home)()}
function home(){app.innerHTML=`<h2>Welcome to OncoViva 👋</h2><p class="muted">Build and practise your own Surgical Oncology question bank.</p>
<div class="stats"><div class="stat"><b>${questions.length}</b><span>MCQs added</span></div><div class="stat"><b>${stats.attempted}</b><span>Attempted</span></div><div class="stat"><b>${stats.attempted?Math.round(stats.correct/stats.attempted*100):0}%</b><span>Accuracy</span></div></div>
<section class="panel"><h3>Your question manager</h3><p class="muted">Add MCQs with four options, a correct answer, explanation, topic and source reference. Your questions are saved on this device.</p><div class="actions"><button onclick="setTab('add')">＋ Add a question</button><button class="secondary" onclick="setTab('bank')">Open question bank</button></div></section>
<div class="notice"><b>Free version:</b> Questions are stored in this browser on this device only. They do not automatically sync to friends or other phones. Use Export backup to keep a copy.</div>
<section class="panel"><h3>Quick start</h3><ol><li>Tap <b>Add MCQ</b> to enter a question.</li><li>Open <b>Question bank</b> to edit, delete or bookmark it.</li><li>Use <b>Practice</b> to answer saved questions.</li></ol></section>`}
function showAdd(q=null){app.innerHTML=`<h2>${q?'Edit MCQ':'Add a new MCQ'}</h2><p class="muted">Enter your own question and answer details.</p>
<form id="qform" class="panel">
<label for="topic">Topic / cancer site *</label><input id="topic" required maxlength="70" placeholder="e.g. Breast, Esophagus, Gastric" value="${esc(q?.topic||'')}">
<label for="kind">Question category</label><select id="kind"><option ${q?.kind==='General'?'selected':''}>General</option><option ${q?.kind==='Clinical trial'?'selected':''}>Clinical trial</option><option ${q?.kind==='Image-based'?'selected':''}>Image-based</option><option ${q?.kind==='Staging'?'selected':''}>Staging</option><option ${q?.kind==='Surgical technique'?'selected':''}>Surgical technique</option></select>
<label for="question">Question *</label><textarea id="question" required maxlength="1200" placeholder="Type the question here...">${esc(q?.question||'')}</textarea>
${[0,1,2,3].map(i=>`<label for="o${i}">Option ${'ABCD'[i]} *</label><input id="o${i}" required maxlength="350" placeholder="Enter option ${'ABCD'[i]}" value="${esc(q?.options?.[i]||'')}">`).join('')}
<label for="correct">Correct answer *</label><select id="correct">${['A','B','C','D'].map((x,i)=>`<option value="${i}" ${(q?.correct??0)===i?'selected':''}>${x}</option>`).join('')}</select>
<label for="explanation">Explanation</label><textarea id="explanation" maxlength="1800" placeholder="Why is this the correct answer?">${esc(q?.explanation||'')}</textarea>
<label for="reference">Reference / source</label><input id="reference" maxlength="300" placeholder="Trial paper, guideline, textbook, DOI..." value="${esc(q?.reference||'')}">
<div class="actions"><button type="submit">${q?'Save changes':'Save MCQ'}</button><button type="button" class="secondary" onclick="setTab('bank')">Cancel</button></div>
<p class="small muted">Fields marked * are required. Please use original questions or content you have permission to use.</p></form>`;
document.getElementById('qform').onsubmit=e=>{e.preventDefault();const item={id:q?.id||('q'+Date.now()),topic:document.getElementById('topic').value.trim(),kind:document.getElementById('kind').value,question:document.getElementById('question').value.trim(),options:[0,1,2,3].map(i=>document.getElementById('o'+i).value.trim()),correct:Number(document.getElementById('correct').value),explanation:document.getElementById('explanation').value.trim(),reference:document.getElementById('reference').value.trim(),created:q?.created||Date.now()};if(q){questions=questions.map(x=>x.id===q.id?item:x)}else questions.unshift(item);persist();setTab('bank');};}
function showBank(){let topics=[...new Set(questions.map(q=>q.topic))];app.innerHTML=`<h2>Question bank</h2><p class="muted">${questions.length} question${questions.length===1?'':'s'} saved on this device.</p>
<div class="actions"><button onclick="setTab('add')">＋ Add MCQ</button><button class="secondary" onclick="exportBackup()">Export backup</button><button class="secondary" onclick="document.getElementById('importFile').click()">Import backup</button></div><input id="importFile" type="file" accept="application/json,.json" hidden>
${questions.length?`<label for="filter">Filter by topic</label><select id="filter"><option value="">All topics</option>${topics.map(t=>`<option>${esc(t)}</option>`).join('')}</select><div id="qList"></div>`:`<section class="panel empty"><div class="symbol">＋</div><b>Your question bank is empty</b><p class="muted">Add your first Surgical Oncology MCQ.</p><button onclick="setTab('add')">Add first MCQ</button></section>`}
<div class="notice">Backup tip: Export your question bank regularly. Importing a backup adds its questions to this device.</div>`;
const renderList=()=>{let f=document.getElementById('filter')?.value||'';let rows=questions.filter(q=>!f||q.topic===f);document.getElementById('qList').innerHTML=rows.map(q=>`<div class="panel"><div class="listhead"><b>${esc(q.question)}</b><span class="pill">${esc(q.topic)}</span></div><p class="small muted">${esc(q.kind)} · Correct: ${'ABCD'[q.correct]}</p><div class="actions"><button class="secondary" onclick="editQ('${q.id}')">Edit</button><button class="secondary" onclick="toggleSaved('${q.id}')">${saved.includes(q.id)?'★ Saved':'☆ Save'}</button><button class="danger" onclick="deleteQ('${q.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No questions in this topic.</p>'};if(questions.length){document.getElementById('filter').onchange=renderList;renderList();document.getElementById('importFile').onchange=importBackup}}
function editQ(id){const q=questions.find(x=>x.id===id);if(q)showAdd(q)}
function deleteQ(id){if(confirm('Delete this question?')){questions=questions.filter(q=>q.id!==id);saved=saved.filter(x=>x!==id);persist();showBank()}}
function toggleSaved(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];persist();showBank()}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'OncoViva',version:1,questions},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='oncoviva-question-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data.questions))throw Error();let added=0;data.questions.forEach(q=>{if(q.question&&Array.isArray(q.options)&&q.options.length===4&&!questions.some(x=>x.id===q.id)){questions.push(q);added++}});persist();alert(added+' questions imported.');showBank()}catch(err){alert('This file is not a valid OncoViva backup.')}};r.readAsText(file)}
function showPractice(){app.innerHTML=`<h2>Practice</h2><p class="muted">Practise questions you've added to your bank.</p>${questions.length?`<section class="panel"><p>${questions.length} questions available.</p><label for="practiceTopic">Choose topic</label><select id="practiceTopic"><option value="">All topics</option>${[...new Set(questions.map(q=>q.topic))].map(t=>`<option>${esc(t)}</option>`).join('')}</select><button style="width:100%;margin-top:12px" onclick="startPractice()">Start practice</button></section><div id="practiceArea"></div>`:`<section class="panel empty"><div class="symbol">▤</div><b>No questions to practise yet</b><p class="muted">Add your own MCQs first.</p><button onclick="setTab('add')">Add MCQ</button></section>`}}
function startPractice(){let t=document.getElementById('practiceTopic').value;practiceQueue=questions.filter(q=>!t||q.topic===t).sort(()=>Math.random()-.5);nextQuestion()}
function nextQuestion(){if(!practiceQueue.length){document.getElementById('practiceArea').innerHTML='<section class="panel"><h3>Session complete</h3><p class="muted">You have reached the end of this practice set.</p><button onclick="showPractice()">Back to practice</button></section>';return}current=practiceQueue.shift();chosen=null;answered=false;renderQuestion()}
function renderQuestion(){let area=document.getElementById('practiceArea');area.innerHTML=`<section class="panel"><div class="listhead"><span class="pill">${esc(current.topic)}</span><span class="small muted">${practiceQueue.length+1} in this set</span></div><div class="question">${esc(current.question)}</div><div id="choices">${current.options.map((o,i)=>`<button class="choice" data-i="${i}">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div><div id="feedback"></div><div class="actions"><button class="secondary" onclick="toggleSaved('${current.id}')">${saved.includes(current.id)?'★ Saved':'☆ Save'}</button></div></section>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)))}
function answer(i){if(answered)return;answered=true;chosen=i;stats.attempted++;if(i===current.correct)stats.correct++;persist();document.querySelectorAll('.choice').forEach((b,n)=>{if(n===current.correct)b.classList.add('correct');else if(n===i)b.classList.add('wrong');b.disabled=true});document.getElementById('feedback').innerHTML=`<div class="panel"><b>${i===current.correct?'Correct!':'Not quite.'}</b><p>${esc(current.explanation||'No explanation has been added.')}</p>${current.reference?`<p class="small muted">Reference: ${esc(current.reference)}</p>`:''}<button onclick="nextQuestion()">Next question</button></div>`}
function showProgress(){app.innerHTML=`<h2>Progress</h2><p class="muted">Your practice activity on this device.</p><div class="stats"><div class="stat"><b>${questions.length}</b><span>Questions</span></div><div class="stat"><b>${stats.attempted}</b><span>Attempted</span></div><div class="stat"><b>${stats.attempted?Math.round(stats.correct/stats.attempted*100):0}%</b><span>Accuracy</span></div></div><section class="panel"><h3>Saved questions</h3><p>${saved.length} bookmarked</p><button class="secondary" onclick="showSaved()">View saved</button></section><div class="actions"><button class="danger" onclick="resetProgress()">Reset practice statistics</button></div>`}
function showSaved(){let list=questions.filter(q=>saved.includes(q.id));app.innerHTML=`<h2>Saved questions</h2>${list.length?list.map(q=>`<section class="panel"><b>${esc(q.question)}</b><p class="small muted">${esc(q.topic)}</p><button class="secondary" onclick="toggleSaved('${q.id}');showSaved()">Remove bookmark</button></section>`).join(''):'<section class="panel empty">No saved questions yet.</section>'}`}
function resetProgress(){if(confirm('Reset attempted and correct-answer statistics? Your questions will not be deleted.')){stats={attempted:0,correct:0};persist();showProgress()}}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
home();
</script>
</body></html>
